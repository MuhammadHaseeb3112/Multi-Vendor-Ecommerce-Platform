name: CI

# Runs the test suite on PostgreSQL (the same database as production) for
# every push and pull request. On main, a green run triggers the Deploy
# workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: markethub
          POSTGRES_USER: markethub
          POSTGRES_PASSWORD: markethub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markethub -d markethub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: markethub
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test api -v 2
