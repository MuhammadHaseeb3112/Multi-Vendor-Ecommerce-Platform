{% extends 'base.html' %}
{% load static %}
{% block title %}{{ category.name }} Products - My Store{% endblock %}
{% block content %}
<section class="py-5 bg-light">
  <div class="container">
    <div class="row">

      <!-- Filters -->
      <div class="col-lg-3 mb-4">
        <h5 class="fw-bold mb-3">Filter by Category</h5>
        <form id="filterForm">
          {% for category in categories %}
          <div class="form-check">
            <input class="form-check-input category-filter" type="checkbox" name="category" value="{{ category.id }}" id="cat{{ category.id }}">
            <label class="form-check-label" for="cat{{ category.id }}">{{ category.name }}</label>
          </div>
          {% endfor %}
        </form>
      </div>

      <!-- Products -->
      <div class="col-lg-9">
        <div id="productContainer">
          {% include 'products/product_list_ajax.html' %}
        </div>
      </div>

    </div>
  </div>
</section>

<script>
  // Refresh the product list when category checkboxes change (no jQuery needed).
  function fetchFilteredProducts() {
    const params = new URLSearchParams();
    document.querySelectorAll('input[name="category"]:checked').forEach(function (box) {
      params.append('categories[]', box.value);
    });
    fetch("{% url 'ajax_filter_products' %}?" + params.toString())
      .then(function (res) { return res.json(); })
      .then(function (data) { document.getElementById('productContainer').innerHTML = data.html; });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.category-filter').forEach(function (box) {
      box.addEventListener('change', fetchFilteredProducts);
    });
  });
</script>
{% endblock %}
