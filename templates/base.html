{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MarketHub{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}MarketHub is a multi-vendor marketplace: shop electronics, fashion and home products from independent stores, with secure checkout and order tracking.{% endblock %}">
  <meta name="theme-color" content="#BB2D3B">

  <!-- Favicon -->
  <link rel="shortcut icon" href="{% static 'images/new-favion.ico' %}" type="image/x-icon">

  <!-- All CSS/JS/fonts are served from our own domain (static/vendor), so the
       browser makes no extra connections to CDNs before it can paint. -->
  <link rel="preload" href="{% static 'vendor/poppins/poppins-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'vendor/poppins/poppins-latin-700-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <style>
    /* Poppins, self-hosted (static/vendor/poppins). Inline so the browser
       finds the fonts without fetching another stylesheet first. */
    @font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;src:url({% static 'vendor/poppins/poppins-latin-400-normal.woff2' %}) format('woff2')}
    @font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;src:url({% static 'vendor/poppins/poppins-latin-500-normal.woff2' %}) format('woff2')}
    @font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;src:url({% static 'vendor/poppins/poppins-latin-600-normal.woff2' %}) format('woff2')}
    @font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;src:url({% static 'vendor/poppins/poppins-latin-700-normal.woff2' %}) format('woff2')}
    /* Below-the-fold home sections: let the browser skip laying them out
       and painting them until they are about to scroll into view. */
    .lazy-section{content-visibility:auto;contain-intrinsic-size:auto 600px}
    /* Keep icon space reserved while the icon stylesheet loads, so nothing jumps. */
    i.fa,i.fas,i.far,i.fab,i.fa-solid,i.fa-regular,i.fa-brands{display:inline-block;min-width:1em}
  </style>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">

  <!-- Icons and scroll-animation styles are not needed for the first paint:
       load them without blocking rendering. -->
  <link rel="preload" href="{% static 'vendor/fontawesome/css/all.min.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="{% static 'vendor/aos/aos.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  </noscript>

  <!-- Deferred: they run after the HTML is parsed, in this order, before
       DOMContentLoaded. Page scripts that use them wait for DOMContentLoaded. -->
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}" defer></script>
  <script src="{% static 'vendor/aos/aos.js' %}" defer></script>
  <script src="{% static 'js/site.js' %}" defer></script>

  {% block extra_head %}{% endblock %}
  {% block extra_css %}{% endblock %}
  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f4f4f4;
    }

    .topbar {
      background-color: #f8f9fa;
      font-size: 14px;
      padding: 6px 0;
    }

    .topbar a {
      color: #333;
      margin-left: 12px;
      transition: color 0.2s ease;
    }

    .topbar a:hover {
      color: #BB2D3B;
    }

    .navbar-brand img {
      height: 44px;
    }

    .navbar-nav .nav-link {
      font-weight: 500;
      color: #333 !important;
      padding: 8px 16px;
    }

    .navbar-nav .nav-link.active,
    .navbar-nav .nav-link:hover {
      color: #BB2D3B !important;
    }

    .cart-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 320px;
      height: 100%;
      background: #fff;
      box-shadow: -2px 0 15px rgba(0, 0, 0, 0.1);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 1000;
      overflow-y: auto;
    }

    .cart-sidebar.open {
      transform: translateX(0);
    }

    .cart-sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
    }

    .cart-item {
      padding: 15px;
      border-bottom: 1px solid #f1f1f1;
    }

    .cart-item img {
      width: 50px;
      height: 50px;
      object-fit: cover;
    }

    .cart-item-details {
      display: flex;
      flex-direction: column;
      margin-left: 10px;
    }

    .cart-total {
      font-size: 18px;
      font-weight: 700;
      padding: 20px;
      border-top: 1px solid #f1f1f1;
    }

    .scrolling-wrapper {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 1rem;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 1rem;
    }

    .scrolling-wrapper::-webkit-scrollbar {
      display: none;
    }

    .scroll-item {
      display: inline-block;
      min-width: 250px;
      flex: 0 0 auto;
      margin-right: 16px;
      transition: transform 0.3s ease;
    }

    .scroll-item:hover {
      transform: translateY(-5px);
    }

    .product-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 50%;
      padding: 10px;
      background-size: 60% 60%;
    }

    .left-buttons {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .left-buttons a,
    .left-buttons button {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: white;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .left-buttons a {
      background-color: #25d366;
    }

    .left-buttons button {
      background-color: #BB2D3B;
    }

    .left-buttons a:hover,
    .left-buttons button:hover {
      opacity: 0.85;
      transform: scale(1.05);
    }

    footer * {
      color: white !important;
    }
  </style>
</head>

<body>

  {% include 'includes/header.html' %}
  {% include 'includes/navigation.html' %}

  <main id="main-content">
  {% block content %}{% endblock %}
  </main>

  <!-- OpenWidget & WhatsApp -->
  <div class="left-buttons">
    <a href="https://wa.me/923130067082" aria-label="WhatsApp" target="_blank" title="Chat on WhatsApp">
      <i class="fab fa-whatsapp"></i>
    </a>
    <button id="chatbot-launch" title="Ask a Question" aria-label="Ask a question">
      <i class="fas fa-comments"></i>
    </button>
  </div>

  <script>
    // OpenWidget script
    window.__ow = window.__ow || {};
    window.__ow.organizationId = "ecfcca0e-31ae-499d-ae2e-a270e32869a0";
    // Don't load the widget straight away; static/js/site.js starts it after
    // the page has loaded (see window.__owStart below).
    window.__ow.asyncInit = true;
    (function (n, t, c) {
      function i(n) { return e._h ? e._h.apply(null, n) : e._q.push(n); }
      var e = {
        _q: [], _h: null, _v: "2.0",
        on: function () { i(["on", c.call(arguments)]) },
        once: function () { i(["once", c.call(arguments)]) },
        off: function () { i(["off", c.call(arguments)]) },
        get: function () {
          if (!e._h) throw new Error("[OpenWidget] You can't use getters before load.");
          return i(["get", c.call(arguments)])
        },
        call: function () { i(["call", c.call(arguments)]) },
        init: function () {
          var n = t.createElement("script");
          n.async = !0;
          n.type = "text/javascript";
          n.src = "https://cdn.openwidget.com/openwidget.js";
          t.head.appendChild(n)
        }
      };
      !n.__ow.asyncInit && e.init(), n.OpenWidget = n.OpenWidget || e
    })(window, document, [].slice);
    window.__owStart = function () {
      if (window.__owStarted) return;
      window.__owStarted = true;
      OpenWidget.init();
    };

    document.getElementById("chatbot-launch").addEventListener("click", function () {
      if (window.OpenWidget && typeof OpenWidget.call === "function") {
        window.__owStart();
        OpenWidget.call("show");
      }
    });
  </script>


  {% block extra_js %}{% endblock %}
</body>

</html>
